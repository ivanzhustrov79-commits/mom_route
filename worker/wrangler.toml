name = "momroute-push"
main = "index.js"
compatibility_date = "2026-01-01"

# Раз в минуту воркер смотрит, кого пора будить.
[triggers]
crons = ["* * * * *"]

# Очередь моментов пробуждения. id подставится после:
#   npx wrangler kv namespace create PUSHQ
[[kv_namespaces]]
binding = "PUSHQ"
id = "ЗАМЕНИТЬ_НА_ID_ИЗ_КОМАНДЫ_ВЫШЕ"

# Открытый ключ не секрет — пусть лежит рядом.
[vars]
VAPID_PUBLIC = "ВСТАВИТЬ_ОТКРЫТЫЙ_КЛЮЧ"
VAPID_SUBJECT = "mailto:ivan.zhustrov79@gmail.com"

# Секреты сюда НЕ пишем. Они задаются командами:
#   npx wrangler secret put VAPID_PRIVATE
#   npx wrangler secret put APP_SECRET
